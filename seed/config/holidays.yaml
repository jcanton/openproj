# Non-working days: public holidays plus the plant's year-end shutdown.
#
# Weekends are already excluded by the scheduler, so days that fall on a
# Saturday or Sunday in 2026 are listed for completeness only and change
# nothing. Half-days are not representable and are therefore not listed — the
# model has no fractional working day.
holidays:
  - 2026-01-01   # New Year
  - 2026-01-02   # Day after New Year
  - 2026-04-03   # Good Friday
  - 2026-04-06   # Easter Monday
  - 2026-05-01   # Labour Day
  - 2026-05-14   # Ascension
  - 2026-05-25   # Whit Monday
  - 2026-08-01   # National Day (Saturday in 2026)
  - 2026-12-24   # Year-end shutdown begins
  - 2026-12-25   # Christmas Day
  - 2026-12-26   # Boxing Day (Saturday in 2026)
  - 2026-12-28   # Year-end shutdown
  - 2026-12-29   # Year-end shutdown
  - 2026-12-30   # Year-end shutdown
  - 2026-12-31   # Year-end shutdown
